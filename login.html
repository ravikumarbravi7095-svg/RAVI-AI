
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAVI AI - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d1b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: #141d32;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 35px #0008;
    }

    h1 { color: #55c8ff; }

    input, button {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: white;
      color: #111;
      border: none;
    }

    button {
      background: #168cff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary { background: #34445f; }

    #message {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>RAVI AI</h1>
    <h3 id="heading">Create Your Account</h3>

    <input
      id="email"
      type="email"
      placeholder="Email Address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="mainBtn" onclick="submitForm()">
      Sign Up
    </button>

    <button
      class="secondary"
      id="switchBtn"
      onclick="switchMode()"
    >
      Already have an account? Login
    </button>

    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL =
      "https://kezfijofsoshaybfwxmf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TPZ-w9g6zedWYexUBVSTMA_l76XYhzY";

    const DASHBOARD_URL =
      "/RAVI-AI/";

    const LOGIN_URL =
      "https://ravikumarbravi7095-svg.github.io/RAVI-AI/login.html";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let isSignup = true;

    function switchMode() {
      isSignup = !isSignup;

      document.getElementById("heading").textContent =
        isSignup ? "Create Your Account" : "Welcome Back";

      document.getElementById("mainBtn").textContent =
        isSignup ? "Sign Up" : "Login";

      document.getElementById("switchBtn").textContent =
        isSignup
          ? "Already have an account? Login"
          : "New user? Create Account";

      document.getElementById("message").textContent = "";
    }

    async function submitForm() {
      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");

      const button =
        document.getElementById("mainBtn");

      if (!email || !password) {
        message.textContent =
          "Please enter your email and password.";
        return;
      }

      if (password.length < 6) {
        message.textContent =
          "Password must contain at least 6 characters.";
        return;
      }

      button.disabled = true;
      message.textContent = "Please wait...";

      try {
        let result;

        if (isSignup) {
          result = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              emailRedirectTo: LOGIN_URL
            }
          });

        } else {
          result =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });
        }

        if (result.error) {
          throw result.error;
        }

        if (isSignup && !result.data.session) {
          message.textContent =
            "Account created! Please confirm your email. Then return here and Login.";
        } else {
          message.textContent =
            "Login successful! Opening RAVI AI...";
          window.location.assign(DASHBOARD_URL);
        }

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    async function checkLogin() {
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        document.getElementById("message").textContent =
          error.message;
        return;
      }

      if (data.session) {
        window.location.replace(DASHBOARD_URL);
      }
    }

    checkLogin();
  </script>

</body>
</html>
